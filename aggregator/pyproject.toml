[project]
name = "mcp-aggregator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.9",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "anyio>=4.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_aggregator"]
