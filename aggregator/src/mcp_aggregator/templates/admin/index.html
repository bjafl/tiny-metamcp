{% extends "base.html" %}
{% block title %}Dashboard — MCP Aggregator{% endblock %}
{% block head %}
<script src="https://unpkg.com/alpinejs@3" defer></script>
{% endblock %}
{% block content %}

<div x-data="adminApp()" x-init="init()">

  <!-- Tab navigation -->
  <div class="tab-list">
    <button class="tab-btn" :class="{ active: tab === 'servers' }" @click="tab = 'servers'">Servers</button>
    <button class="tab-btn" :class="{ active: tab === 'logs' }"    @click="tab = 'logs'; startLogs()">Logs</button>
    <button class="tab-btn" :class="{ active: tab === 'tester' }"  @click="tab = 'tester'; loadTools()">Tool Tester</button>
  </div>

  <!-- ── Servers tab ─────────────────────────────────────────────────────── -->
  <div x-show="tab === 'servers'">

    <!-- Add server accordion -->
    <details style="margin-bottom:1.5rem">
      <summary>Add server</summary>
      <form hx-post="/admin/add-server"
            hx-target="#add-result"
            hx-swap="innerHTML"
            hx-on::after-request="htmx.trigger('#servers-table', 'reload')"
            style="margin-top:1rem">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <label>Name
            <input type="text" name="name" placeholder="my-server" required>
          </label>
          <label>Type
            <select name="type">
              <option value="pypi">PyPI (uvx)</option>
              <option value="npm">npm (npx)</option>
              <option value="git">Git repo</option>
              <option value="cmd">Command</option>
            </select>
          </label>
        </div>
        <label>Package / source
          <input type="text" name="package" placeholder="mcp-server-fetch  or  git+https://…  or  /usr/bin/cmd" required>
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <label>Args <small>(comma-separated, first non-flag = entrypoint)</small>
            <input type="text" name="args" placeholder="mcp-server-fetch, --flag">
          </label>
          <label>Env <small>(KEY=VALUE, comma-separated)</small>
            <input type="text" name="env" placeholder="API_KEY=abc, DEBUG=1">
          </label>
        </div>
        <button type="submit">Add server</button>
        <span class="htmx-indicator" aria-busy="true" style="margin-left:0.5rem">Installing…</span>
      </form>
      <div id="add-result" style="margin-top:0.5rem"></div>
    </details>

    <!-- Servers table -->
    <div id="servers-table"
         hx-get="/admin/servers-table"
         hx-trigger="load, reload"
         hx-swap="innerHTML">
      <p aria-busy="true">Loading servers…</p>
    </div>

  </div>

  <!-- ── Logs tab ────────────────────────────────────────────────────────── -->
  <div x-show="tab === 'logs'" x-cloak>
    <div style="display:flex;gap:1rem;align-items:center;margin-bottom:0.75rem">
      <label style="margin:0;flex:0 0 auto">Server filter
        <select x-model="logServer" @change="resetLogs()" style="margin-top:0.25rem">
          <option value="">All servers</option>
          <template x-for="s in serverNames" :key="s">
            <option :value="s" x-text="s"></option>
          </template>
        </select>
      </label>
      <label style="margin:0;flex:0 0 auto">Level
        <select x-model="logLevel" style="margin-top:0.25rem">
          <option value="">All</option>
          <option>DEBUG</option><option>INFO</option>
          <option>WARNING</option><option>ERROR</option>
        </select>
      </label>
      <div style="margin-left:auto;display:flex;gap:0.5rem">
        <button class="outline secondary" @click="resetLogs()" style="padding:0.3rem 0.8rem;font-size:0.85rem">Clear</button>
        <span x-show="logConnected" style="font-size:0.8rem;color:var(--pico-ins-color)">● Live</span>
        <span x-show="!logConnected" style="font-size:0.8rem;color:var(--pico-del-color)">○ Disconnected</span>
      </div>
    </div>
    <div class="log-box" id="log-box">
      <template x-if="logLines.length === 0">
        <span style="color:#6c7086">No log entries yet.</span>
      </template>
      <template x-for="line in filteredLogs()" :key="line.ts + line.msg">
        <div class="log-line">
          <span class="log-ts"  x-text="fmtTs(line.ts)"></span>
          <span class="log-lvl" :class="'lvl-' + line.level" x-text="line.level"></span>
          <span class="log-srv" x-text="line.server || '-'"></span>
          <span class="log-msg" x-text="line.msg"></span>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Tool Tester tab ────────────────────────────────────────────────── -->
  <div x-show="tab === 'tester'" x-cloak>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
      <label>Server
        <select x-model="tServer" @change="tTool=''; tSchema=null" style="margin-top:0.25rem">
          <option value="">— select server —</option>
          <template x-for="s in tServers" :key="s">
            <option :value="s" x-text="s"></option>
          </template>
        </select>
      </label>
      <label>Tool
        <select x-model="tTool" @change="updateSchema()" style="margin-top:0.25rem">
          <option value="">— select tool —</option>
          <template x-for="t in toolsForServer()" :key="t.tool">
            <option :value="t.tool" x-text="t.tool"></option>
          </template>
        </select>
      </label>
    </div>

    <template x-if="tSchema">
      <div>
        <p><small>Input schema:</small></p>
        <pre class="schema-box" x-text="JSON.stringify(tSchema, null, 2)"></pre>
      </div>
    </template>

    <label>Arguments (JSON)
      <textarea x-model="tArgs" rows="4" style="font-family:monospace;font-size:0.85rem"
                placeholder='{"param": "value"}'></textarea>
    </label>

    <button @click="callTool()" :disabled="!tTool || tCalling">
      <span x-show="!tCalling">Call tool</span>
      <span x-show="tCalling" aria-busy="true">Calling…</span>
    </button>

    <template x-if="tResult !== null">
      <div style="margin-top:1rem">
        <p><small>Result:</small></p>
        <pre class="result-box" :class="{ error: tIsError }" x-text="tResult"></pre>
      </div>
    </template>
  </div>

</div>

<script>
function adminApp() {
  return {
    tab: 'servers',
    // --- Logs ---
    logLines: [],
    logServer: '',
    logLevel: '',
    logConnected: false,
    _logEs: null,
    serverNames: [],
    // --- Tool tester ---
    tServers: [],
    tTools: [],
    tServer: '',
    tTool: '',
    tSchema: null,
    tArgs: '{}',
    tResult: null,
    tIsError: false,
    tCalling: false,

    init() {
      fetch('/api/servers')
        .then(r => r.json())
        .then(data => {
          this.serverNames = data.filter(s => s.running).map(s => s.name);
        });
    },

    // ── Logs ──────────────────────────────────────────────────────────────
    startLogs() {
      if (this._logEs) return;
      const url = this.logServer ? `/api/logs/stream?server=${this.logServer}` : '/api/logs/stream';
      const es = new EventSource(url);
      this._logEs = es;
      es.onopen = () => { this.logConnected = true; };
      es.onmessage = (e) => {
        const entry = JSON.parse(e.data);
        this.logLines.push(entry);
        if (this.logLines.length > 2000) this.logLines.shift();
        this.$nextTick(() => {
          const box = document.getElementById('log-box');
          if (box) box.scrollTop = box.scrollHeight;
        });
      };
      es.onerror = () => { this.logConnected = false; };
    },

    resetLogs() {
      if (this._logEs) { this._logEs.close(); this._logEs = null; }
      this.logLines = [];
      this.logConnected = false;
      if (this.tab === 'logs') this.startLogs();
    },

    filteredLogs() {
      return this.logLines.filter(l => {
        if (this.logServer && l.server !== this.logServer) return false;
        if (this.logLevel && l.level !== this.logLevel) return false;
        return true;
      });
    },

    fmtTs(ts) {
      return new Date(ts * 1000).toTimeString().slice(0, 8);
    },

    // ── Tool tester ────────────────────────────────────────────────────────
    loadTools() {
      if (this.tTools.length) return;
      fetch('/api/tools')
        .then(r => r.json())
        .then(data => {
          this.tTools = data;
          this.tServers = [...new Set(data.map(t => t.server))];
        });
    },

    toolsForServer() {
      return this.tTools.filter(t => t.server === this.tServer);
    },

    updateSchema() {
      const t = this.tTools.find(x => x.server === this.tServer && x.tool === this.tTool);
      this.tSchema = t ? t.inputSchema : null;
      this.tResult = null;
    },

    async callTool() {
      let args;
      try { args = JSON.parse(this.tArgs); } catch { alert('Invalid JSON in arguments'); return; }
      this.tCalling = true;
      this.tResult = null;
      try {
        const resp = await fetch('/api/tools/call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ server: this.tServer, tool: this.tTool, arguments: args }),
        });
        const data = await resp.json();
        this.tIsError = data.isError || !resp.ok;
        this.tResult = JSON.stringify(data.content ?? data, null, 2);
      } catch (err) {
        this.tIsError = true;
        this.tResult = String(err);
      } finally {
        this.tCalling = false;
      }
    },
  };
}
</script>
{% endblock %}
