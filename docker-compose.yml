services:

  mcp-aggregator:
    build:
      context: .
      dockerfile: packages/aggregator/Dockerfile
    container_name: mcp-aggregator
    restart: unless-stopped
    labels:
      # Coolify's Traefik has no way to pick which of this container's
      # networks to route through once it's on more than one -- without this
      # it silently picked shared-mcp-net (which coolify-proxy isn't on),
      # hanging every request. This must be the network Coolify's own
      # coolify-proxy container is actually attached to for this resource
      # (verify with `docker network ls` / `docker inspect coolify-proxy` on
      # the host if this project is ever recreated as a new Coolify resource
      # -- the name is that resource's UUID, not portable across recreation).
      - "traefik.docker.network=zvuwbrddd8huzple7brnk5y9"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DATA_DIR: "/data"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      SESSION_SECRET: "${SESSION_SECRET}"
      MCP_DOMAIN: "${MCP_DOMAIN}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_ALLOWED_USERS: "${GITHUB_ALLOWED_USERS}"
    expose:
      - 8000
    volumes:
      - mcp-data:/data
    networks:
      - default
      - shared-mcp-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mcp-data:
    driver: local

networks:
  # Pre-created on the host (docker network create shared-mcp-net) so this
  # aggregator can proxy MCP servers deployed as separate Coolify projects
  # (e.g. gstream's mcp-server), which Coolify otherwise network-isolates
  # per-project. "default" is intentionally NOT declared here -- Coolify
  # manages its naming/creation itself; redeclaring it created a spurious
  # duplicate network that coolify-proxy wasn't attached to.
  shared-mcp-net:
    external: true
