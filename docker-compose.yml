services:

  mcp-aggregator:
    build:
      context: ./aggregator
      dockerfile: Dockerfile
    container_name: mcp-aggregator
    restart: unless-stopped
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DATA_DIR: "/data"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      SESSION_SECRET: "${SESSION_SECRET}"
      MCP_DOMAIN: "${MCP_DOMAIN}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_ALLOWED_USERS: "${GITHUB_ALLOWED_USERS}"
    volumes:
      - mcp-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.rule=Host(`${MCP_DOMAIN}`)"
      - "traefik.http.routers.mcp.entrypoints=https"
      - "traefik.http.routers.mcp.tls=true"
      - "traefik.http.routers.mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp.loadbalancer.server.port=8000"
      # Disable response buffering so SSE streams are delivered immediately
      - "traefik.http.middlewares.mcp-sse.headers.customResponseHeaders.X-Accel-Buffering=no"
      - "traefik.http.routers.mcp.middlewares=mcp-sse"

volumes:
  mcp-data:
    driver: local
