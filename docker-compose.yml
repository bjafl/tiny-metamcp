services:

  mcp-aggregator:
    build:
      context: .
      dockerfile: packages/aggregator/Dockerfile
    container_name: mcp-aggregator
    restart: unless-stopped
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DATA_DIR: "/data"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      SESSION_SECRET: "${SESSION_SECRET}"
      MCP_DOMAIN: "${MCP_DOMAIN}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_ALLOWED_USERS: "${GITHUB_ALLOWED_USERS}"
    expose:
      - 8000
    volumes:
      - mcp-data:/data
    networks:
      - default
      - shared-mcp-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mcp-data:
    driver: local

networks:
  default:
  # Pre-created on the host (docker network create shared-mcp-net) so this
  # aggregator can proxy MCP servers deployed as separate Coolify projects
  # (e.g. gstream's mcp-server), which Coolify otherwise network-isolates
  # per-project.
  shared-mcp-net:
    external: true
