[project]
name = "mcp-aggregator"
version = "2.0.1"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52",
    "mcp>=2",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "anyio>=4.11",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "sqlmodel>=0.0.38",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aggregator"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length -- the formatter handles wrapping; long strings/URLs still slip through
]

[tool.ruff.lint.isort]
known-first-party = ["aggregator"]
